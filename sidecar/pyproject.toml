[project]
name = "vater-core"
version = "0.2.1"
description = "Vater 사이드카: 한국투자증권 연동, AI 분석, 알림, 브리핑을 담당하는 로컬 백엔드"
requires-python = "==3.13.*"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "sse-starlette",
    "keyring",
    "httpx>=0.28.1",
    "websockets>=17.4",
    "tradingagents",
    "exchange-calendars==4.13.2",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy",
    "respx>=0.23.1",
    "ta-lib==0.8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vater_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not kis_live and not broker_live and not llm'"  # 실연동은 -m kis_live 로 직접 실행
filterwarnings = [
    # stockstats·yfinance(TradingAgents 의존성)가 쓰는 pandas 문법 경고. 동작에는 영향 없음
    "ignore:The inplace keyword in DataFrame:Warning",
    "ignore:Series.values returning an ndarray that drops timezone:Warning",  # exchange_calendars
]
markers = [
    "kis_live: 실제 한국투자증권 키가 필요한 테스트 (기본 제외)",
    "broker_live: 실제 키움·메리츠 키가 필요한 테스트 (기본 제외, 조회만)",
    "llm: 실제 LLM 호출이 필요한 테스트 (기본 제외)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # 한국어 문장의 전각 문자 허용

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S603", "S607"]
"src/vater_core/secrets/names.py" = ["S105"]  # 비밀키 '이름' 목록이지 값이 아니다

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = ["src", "."]
explicit_package_bases = true

[tool.uv.sources]
tradingagents = { git = "https://github.com/TauricResearch/TradingAgents", rev = "v0.7.1" }

[[tool.mypy.overrides]]
# 타입 정보를 제공하지 않는 라이브러리 (TradingAgents와 그 의존성)
module = ["tradingagents.*", "stockstats", "langchain_core.*", "langgraph.*", "pandas", "exchange_calendars", "talib"]
ignore_missing_imports = true
