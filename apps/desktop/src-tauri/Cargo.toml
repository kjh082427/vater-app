[workspace]
members = [".", "crates/vater-sidecar"]
resolver = "3"

[package]
name = "vater"
version = "0.1.0"
edition = "2024"
description = "Vater 데스크톱 셸 (Tauri 2): 창·트레이·단일 인스턴스·자동 실행·Windows 알림, 사이드카 관리"
publish = false

[lib]
# 이름이 바이너리(vater)와 겹치지 않게 (Windows에서 cargo 경고·충돌 방지)
name = "vater_lib"
crate-type = ["rlib"]

# 버전은 배포된 지 2주가 지난 것으로 고정한다 (shell/tauri 계획서 Tech Stack).
[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
vater-sidecar = { path = "crates/vater-sidecar" }
tauri = { version = "=2.12.4", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-notification = "=2.7.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", features = ["sync"] }
